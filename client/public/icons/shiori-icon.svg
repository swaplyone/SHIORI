<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#121212" />
  
  <!-- Subtle E-Ink Frame / Safe Zone -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="#181818" stroke="#262626" stroke-width="4" />
  
  <!-- Stylized Geometric S / Minimalist E-Ink Emblem -->
  <g transform="translate(256, 230)">
    <!-- Top Bar -->
    <rect x="-90" y="-95" width="180" height="34" rx="6" fill="#F5F2EB" />
    
    <!-- Left Top Pillar -->
    <rect x="-90" y="-95" width="34" height="95" rx="6" fill="#F5F2EB" />
    
    <!-- Middle Bar -->
    <rect x="-90" y="-20" width="180" height="34" rx="6" fill="#F5F2EB" />
    
    <!-- Right Bottom Pillar -->
    <rect x="56" y="-20" width="34" height="95" rx="6" fill="#F5F2EB" />
    
    <!-- Bottom Bar -->
    <rect x="-90" y="55" width="180" height="34" rx="6" fill="#F5F2EB" />
    
    <!-- Japanese Kanji 栞 Subtitle in E-Ink typography -->
    <text x="0" y="145" fill="#A0A09C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="8">SHIORI</text>
  </g>
</svg>
